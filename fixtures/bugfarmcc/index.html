<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BugFarm Estates</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <strong>BugFarm Estates</strong>
    <nav>
      <a href="/">Home</a>
      <a href="/listings/">Listings</a>
      <a href="/about.html">About</a>
      <a href="/contact.html">Contact</a>
      <button id="lang" type="button">EN</button>
    </nav>
  </header>

  <main>
    <section class="hero" id="hero">
      <h1>Find your next home</h1>
      <p class="faint">Thousands of verified listings across the city.</p>
      <button id="search-btn" class="btn" type="button">Search</button>
      <button id="filters" class="btn" type="button" aria-expanded="false" aria-controls="filter-panel">Filters</button>
      <button id="newsletter" class="btn" type="button">Newsletter</button>
      <div id="filter-panel" hidden><label><input type="checkbox"> With parking</label></div>
    </section>

    <section id="featured">
      <h2>Featured listings</h2>
      <div class="grid">
        <article class="card"><img src="/img/one.svg" alt="Flat on Nizami"><a href="/listings/1.html">2-room flat, Nizami</a></article>
        <article class="card"><img src="/img/missing.jpg" alt="House in Badamdar"><a href="/listings/2.html">House, Badamdar</a></article>
        <article class="card"><img src="/img/one.svg" alt="Studio"><a href="/listings/404.html">Studio, Yasamal</a></article>
      </div>
    </section>

    <section id="why">
      <h2>Why us</h2>
      <p>We check every listing in person.</p>
      <a class="btn tiny" href="#nowhere">Learn more</a>
    </section>

    <section id="lazy-more"></section>
  </main>

  <footer>
    <a href="/sitemap.xml">Sitemap</a>
    <button id="to-top" type="button">Back to top</button>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
