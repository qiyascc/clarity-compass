<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in - BugFarm Estates</title><link rel="stylesheet" href="/style.css"></head>
<body>
  <header><strong>BugFarm Estates</strong><nav><a href="/">Home</a></nav></header>
  <main><section>
    <h1>Sign in</h1>
    <form action="/session" method="post">
      <label for="email">Email</label> <input id="email" name="email" type="email" autocomplete="username">
      <label for="password">Password</label> <input id="password" name="password" type="password" autocomplete="current-password">
      <button type="submit">Sign in</button>
    </form>
  </section></main>
</body>
</html>
