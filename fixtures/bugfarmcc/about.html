<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>About - BugFarm Estates</title><link rel="stylesheet" href="/style.css"></head>
<body>
  <header><strong>BugFarm Estates</strong><nav><a href="/">Home</a><a href="/listings/">Listings</a></nav></header>
  <main><section><h1>About</h1>
    <button id="team-toggle" type="button" aria-expanded="false" aria-controls="team">Team menu</button>
    <ul id="team" hidden><li>Aysel</li><li>Murad</li></ul>
  </section></main>
  <script>
    const toggle = document.getElementById("team-toggle");
    toggle.addEventListener("click", () => {
      const open = toggle.getAttribute("aria-expanded") === "true";
      toggle.setAttribute("aria-expanded", String(!open));
      document.getElementById("team").hidden = open;
    });
  </script>
</body>
</html>
