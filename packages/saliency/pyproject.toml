[project]
name = "clarity-saliency"
version = "0.1.0"
description = "Attention prediction for UI screenshots with ONNX saliency models."
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1",
  "onnxruntime>=1.20",
  "pillow>=11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clarity_saliency"]
