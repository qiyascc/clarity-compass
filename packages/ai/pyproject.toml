[project]
name = "clarity-ai"
version = "0.1.0"
description = "Language model providers and review agents for Clarity Compass."
requires-python = ">=3.12"
dependencies = ["anthropic>=1.0", "clarity-core", "pydantic>=2.9"]

[project.optional-dependencies]
openai = ["openai>=1.60"]

[tool.uv.sources]
clarity-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clarity_ai"]
