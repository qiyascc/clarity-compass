[project]
name = "clarity-persistence"
version = "0.1.0"
description = "PostgreSQL persistence for Clarity Compass."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "asyncpg>=0.30",
  "clarity-core",
  "cryptography>=43",
  "procrastinate[psycopg]>=3",
  "sqlalchemy[asyncio]>=2.0.36",
]

[tool.uv.sources]
clarity-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clarity_persistence"]
