[project]
name = "clarity-api"
version = "0.1.0"
description = "HTTP API and admin backend for Clarity Compass."
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23.1",
  "clarity-core",
  "clarity-persistence",
  "cryptography>=43",
  "fastapi>=0.115",
  "itsdangerous>=2.2",
  "pydantic-settings>=2.6",
  "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
clarity-core = { workspace = true }
clarity-persistence = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clarity_api"]
