[project]
name = "clarity-worker"
version = "0.1.0"
description = "Browser worker: exploration, capture and interaction testing."
requires-python = ">=3.12"
dependencies = ["clarity-core", "defusedxml>=0.7", "playwright>=1.49"]

[tool.uv.sources]
clarity-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clarity_worker"]
